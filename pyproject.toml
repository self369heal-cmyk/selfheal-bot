[project]
name = "selfheal-bot"
version = "0.1.0"
description = "Telegram-бот «Тайная природа СамоИсцеления»: каталог аудиотреков, оплата GetCourse, рефералка"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
